# UpDance Festival — Worker (API + autenticação) + assets gerados pelo Vite (dist/).
#
# Cloudflare → Workers & Pages → updance-festival → Settings → Build:
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#
# Os recursos abaixo (KV, D1, R2) precisam EXISTIR na conta antes do deploy — o wrangler não os cria.
# Passo a passo no README ("Colocar no ar").

name                = "updance-festival"
compatibility_date  = "2026-06-17"
main                = "./worker/index.js"

[assets]
directory          = "dist"
binding            = "ASSETS"
html_handling      = "auto-trailing-slash"
not_found_handling = "404-page"

# o Worker roda ANTES dos assets só nestas rotas (resto continua estático e rápido).
# /admin/* PRECISA estar aqui: é o Worker que exige a sessão de admin (a_session).
run_worker_first   = ["/api/*", "/admin", "/admin/*", "/ouvir/*"]

# Namespace KV — guarda as sessões (m_session / a_session) e cooldowns.
# Painel: Storage & Databases → Workers KV → (namespace) → copie o "Namespace ID" para cá.
[[kv_namespaces]]
binding = "KV"
id      = "10d76ce53a5049fbab9cab01b68936e2"

[vars]
AMBIENTE         = "producao"
GMAIL_USER       = "updancexperience@gmail.com"
# Custo do hash de senha (mesmo padrão do worker do blog: 100.000).
PBKDF2_ITERACOES = "100000"

[[d1_databases]]
binding        = "DB"
database_name  = "updance-festival_db"
database_id    = "0f27916e-94e5-471a-a408-3588dc65d845"
# Sem migrações: o esquema completo está em schema.sql (executar uma vez no Console do D1).

# Áudios (bucket privado — nunca ativar r2.dev). Criar em: R2 Object Storage → Create bucket.
[[r2_buckets]]
binding     = "AUDIOS"
bucket_name = "updance-festival-audios"

[observability]
enabled = true

# Segredos (NUNCA aqui) — painel: Settings → Variables and Secrets → Add → tipo "Secret":
#   ADMIN_SETUP_KEY     chave de /api/admin/setup (cria/redefine administrador)
#   GMAIL_APP_PASSWORD  senha de app do Gmail (e-mail de "esqueci minha senha")
