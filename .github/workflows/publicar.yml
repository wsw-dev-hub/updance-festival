# UpDance Festival — verifica a cada envio e, na branch main, publica na Cloudflare.
# Configuração (uma vez): Settings → Secrets and variables → Actions. Detalhes no README.
name: Verificar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxe de todos os módulos
        run: for f in $(git ls-files 'src/*.js' 'public/*.js' 'scripts/*.mjs'); do node --check "$f" || exit 1; done
      - name: Build do Worker (sem publicar)
        run: npx wrangler deploy --dry-run --outdir dist

  publicar:
    name: Publicar na Cloudflare
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: producao
      url: ${{ steps.publicacao.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar recursos, migrar updance-festival_db e publicar
        id: publicacao
        run: npm run cf:publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDANCE_KV_ID: ${{ vars.UPDANCE_KV_ID }}
          UPDANCE_BLOG_ORIGIN: ${{ vars.UPDANCE_BLOG_ORIGIN }}
          RETENCAO_AUDIOS_DIAS: ${{ vars.RETENCAO_AUDIOS_DIAS }}
